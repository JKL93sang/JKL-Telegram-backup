name: Userscript checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check userscript syntax
        run: node --check JKL_Telegram_Backup.user.js
      - name: Run unit checks
        run: node tests/userscript.test.cjs
